<table>
<tr><th>指令</th><th>作用</th></tr>
<tr><td><span class="ui">還原</span> <kbd>⌘Z</kbd></td><td>還原上一個變更：標示為已觀看或未觀看，或從資料庫移除單集。</td></tr>
<tr><td><span class="ui">全選</span> <kbd>⌘A</kbd></td><td>選取顯示畫面中的所有方塊，或節目頁面上的所有單集。</td></tr>
<tr><td><span class="ui">從資料庫移除⋯</span> <kbd>⌘⌫</kbd></td><td>詢問後，從 TV App 的資料庫中移除所選的節目、季或單集。影片檔案會保留。</td></tr>
</table>
