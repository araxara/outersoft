<title>鍵盤快速鍵</title>
<meta name="description" content="Mac 上 TV Library Viewer 的鍵盤快速鍵。" />
<meta name="keywords" content="鍵盤快速鍵, 按鍵, Command 鍵" />
<link rel="stylesheet" href="../shared/style.css" />
</head>
<body>
<a name="shortcuts"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer 說明</a> › 參考資料</nav>
<h1>鍵盤快速鍵</h1>
<table>
<tr><th>按鍵</th><th>動作</th></tr>
<tr><td><kbd>⌘K</kbd></td><td>連線至共享資料庫</td></tr>
<tr><td><kbd>⌘O</kbd></td><td>打開資料庫</td></tr>
<tr><td><kbd>⌘R</kbd></td><td>重新整理資料庫</td></tr>
<tr><td><kbd>⌘+</kbd> <kbd>⌘−</kbd> <kbd>⌘0</kbd></td><td>放大、縮小、實際大小方塊</td></tr>
<tr><td><kbd>⌘A</kbd> / <kbd>Esc</kbd></td><td>全選 / 清除選取範圍</td></tr>
<tr><td><kbd>⌘⌫</kbd></td><td>從資料庫移除</td></tr>
<tr><td><kbd>⌘Z</kbd></td><td>還原</td></tr>
<tr><td><kbd>空白鍵</kbd></td><td>在節目頁面上：播放。在播放器中：播放或暫停</td></tr>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>在播放器中：跳過 10 秒</td></tr>
<tr><td><kbd>⌘←</kbd> <kbd>⌘→</kbd></td><td>在「取得資訊」中：上一集或下一集</td></tr>
<tr><td><kbd>⌘,</kbd></td><td>設定</td></tr>
</table>
<p>關於連接鍵盤的 iPad，請參閱<a href="ipad.html">iPad 和 iPhone</a>。</p>
<script src="../shared/langnav.js"></script>
</body>
