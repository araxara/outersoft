<h1>取得資訊</h1>
<p class="lead">從方塊、季或單集的選單中選擇<span class="ui">取得資訊</span>。</p>
<p>其中的區段包括<span class="ui">概覽</span>、<span class="ui">詳細資訊</span>、<span class="ui">插圖</span>（所有影像，可橫向捲動）、<span class="ui">描述</span>、<span class="ui">選項</span>、<span class="ui">排序</span>和<span class="ui">檔案</span>（大小、編解碼器、尺寸、位元率和位置）。使用 ‹ 和 › 可逐集瀏覽一季中的單集（在 Mac 上按 <kbd>⌘←</kbd> <kbd>⌘→</kbd>）。</p>
<p>在 Mac 上，各區段會像在 TV App 中一樣列在左側。在 iPad、iPhone 和 Apple TV 上，它們會顯示為一個列表，iPad 和 iPhone 上還有<span class="ui">全部拷貝</span>。</p>
<div class="see"><h3>另請參閱</h3><ul><li><a href="episodes.html">標示已觀看、選取和移除單集</a></li></ul></div>
