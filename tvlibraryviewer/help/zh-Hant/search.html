<h1>搜尋和 Spotlight</h1>
<p class="platforms">Spotlight：Mac、iPad 和 iPhone。</p>
<h2>在 App 中</h2>
<p>在搜尋欄位中輸入文字：在 Mac 上位於側邊欄頂部，在 iPad 或 iPhone 上位於顯示畫面頂部，在 Apple TV 上則是「搜尋」標籤頁（輸入或聽寫）。顯示畫面中只會顯示名稱相符的節目。</p>
<h2>在 Spotlight 中</h2>
<p>在 Mac、iPad 和 iPhone 上，你正在觀看的資料庫中的每個節目和每一集都會出現在 Spotlight 中。選擇其中一項會在 App 中打開其節目，並定位到該集所在的季。</p>
