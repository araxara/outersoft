<title>キーボードショートカット</title>
<meta name="description" content="MacのTV Library Viewerのキーボードショートカット。" />
<meta name="keywords" content="キーボードショートカット, キー, コマンド" />
<link rel="stylesheet" href="../shared/style.css" />

<body>
<a name="shortcuts"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer ヘルプ</a> › リファレンス</nav>
<h1>キーボードショートカット</h1>
<table>
<tr><th>キー</th><th>操作</th></tr>
<tr><td><kbd>⌘K</kbd></td><td>共有ライブラリに接続</td></tr>
<tr><td><kbd>⌘O</kbd></td><td>ライブラリを開く</td></tr>
<tr><td><kbd>⌘R</kbd></td><td>ライブラリを更新</td></tr>
<tr><td><kbd>⌘+</kbd> <kbd>⌘−</kbd> <kbd>⌘0</kbd></td><td>タイルを大きく、小さく、実際のサイズに</td></tr>
<tr><td><kbd>⌘A</kbd>／<kbd>Esc</kbd></td><td>すべてを選択／選択を解除</td></tr>
<tr><td><kbd>⌘⌫</kbd></td><td>ライブラリから削除</td></tr>
<tr><td><kbd>⌘Z</kbd></td><td>取り消す</td></tr>
<tr><td><kbd>スペースバー</kbd></td><td>番組ページ：再生。プレーヤー：再生または一時停止</td></tr>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>プレーヤー：10秒スキップ</td></tr>
<tr><td><kbd>⌘←</kbd> <kbd>⌘→</kbd></td><td>情報を見る：前または次のエピソード</td></tr>
<tr><td><kbd>⌘,</kbd></td><td>設定</td></tr>
</table>
<p>キーボードを接続したiPadについては、<a href="ipad.html">iPadとiPhone</a>を参照してください。</p>
<script src="../shared/langnav.js"></script>
