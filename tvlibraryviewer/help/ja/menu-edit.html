<title>編集メニュー</title>
<meta name="description" content="取り消す、すべてを選択、ライブラリから削除。" />
<meta name="keywords" content="編集メニュー, 取り消す, やり直す, すべてを選択, ライブラリから削除, 削除" />

<body>
<a name="menu-edit"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer ヘルプ</a> › メニュー</nav>
<h1>編集メニュー</h1>
<table>
<tr><th>コマンド</th><th>機能</th></tr>
<tr><td><span class="ui">取り消す</span> <kbd>⌘Z</kbd></td><td>最後の変更（視聴済みまたは未視聴にする、エピソードをライブラリから削除する）を取り消します。</td></tr>
<tr><td><span class="ui">すべてを選択</span> <kbd>⌘A</kbd></td><td>表示内のすべてのタイル、または番組ページのすべてのエピソードを選択します。</td></tr>
<tr><td><span class="ui">ライブラリから削除…</span> <kbd>⌘⌫</kbd></td><td>確認したあと、選択した番組、シーズン、エピソードをTVアプリのライブラリから削除します。ビデオファイルは残ります。</td></tr>
</table>
<div class="see"><h3>関連項目</h3><ul><li><a href="episodes.html">エピソードを視聴済みにする、選択する、削除する</a></li></ul></div>
