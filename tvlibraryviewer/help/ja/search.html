<h1>検索とSpotlight</h1>
<p class="platforms">Spotlight：Mac、iPad、iPhone。</p>
<h2>アプリ内</h2>
<p>検索フィールドに入力します。Macではサイドバーの上部、iPadやiPhoneでは表示の上部、Apple TVでは検索タブ（入力または音声入力）にあります。名前が一致する番組だけが表示されます。</p>
<h2>Spotlight</h2>
<p>Mac、iPad、iPhoneでは、表示中のライブラリのすべての番組とエピソードをSpotlightで検索できます。結果を選ぶと、アプリでその番組がエピソードのシーズンで開きます。</p>
