<title>键盘快捷键</title>
<meta name="description" content="Mac 上 TV Library Viewer 的键盘快捷键。" />
<meta name="keywords" content="键盘快捷键, 按键, Command 键" />

</head>
<body>
<a name="shortcuts"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer 帮助</a> › 参考</nav>
<h1>键盘快捷键</h1>
<table>
<tr><th>按键</th><th>操作</th></tr>
<tr><td><kbd>⌘K</kbd></td><td>连接到共享资料库</td></tr>
<tr><td><kbd>⌘O</kbd></td><td>打开资料库</td></tr>
<tr><td><kbd>⌘R</kbd></td><td>刷新资料库</td></tr>
<tr><td><kbd>⌘+</kbd> <kbd>⌘−</kbd> <kbd>⌘0</kbd></td><td>放大、缩小、实际大小拼贴</td></tr>
<tr><td><kbd>⌘A</kbd> / <kbd>Esc</kbd></td><td>全选 / 清除选择</td></tr>
<tr><td><kbd>⌘⌫</kbd></td><td>从资料库中移除</td></tr>
<tr><td><kbd>⌘Z</kbd></td><td>撤销</td></tr>
<tr><td><kbd>空格键</kbd></td><td>在节目页面上：播放。在播放器中：播放或暂停</td></tr>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>在播放器中：跳过 10 秒</td></tr>
<tr><td><kbd>⌘←</kbd> <kbd>⌘→</kbd></td><td>在“显示简介”中：上一集或下一集</td></tr>
<tr><td><kbd>⌘,</kbd></td><td>设置</td></tr>
</table>
<p>关于连接了键盘的 iPad，请参阅<a href="ipad.html">iPad 和 iPhone</a>。</p>
<script src="../shared/langnav.js"></script>

</html>
