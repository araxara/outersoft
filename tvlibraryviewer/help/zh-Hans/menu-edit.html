<title>编辑菜单</title>
<meta name="description" content="撤销、全选和从资料库中移除。" />
<meta name="keywords" content="编辑菜单, 撤销, 重做, 全选, 从资料库中移除, 删除" />

</head>
<body>
<a name="menu-edit"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer 帮助</a> › 菜单</nav>
<h1>编辑菜单</h1>
<table>
<tr><th>命令</th><th>作用</th></tr>
<tr><td><span class="ui">撤销</span> <kbd>⌘Z</kbd></td><td>撤销上一次更改：标记为已观看或未观看，或从资料库中移除剧集。</td></tr>
<tr><td><span class="ui">全选</span> <kbd>⌘A</kbd></td><td>选择视图中的所有拼贴，或节目页面上的所有剧集。</td></tr>
<tr><td><span class="ui">从资料库中移除…</span> <kbd>⌘⌫</kbd></td><td>询问后，从 TV App 的资料库中移除所选的节目、季或剧集。视频文件会保留。</td></tr>
</table>
<div class="see"><h3>另请参阅</h3><ul><li><a href="episodes.html">标记已观看、选择和移除剧集</a></li></ul></div>
<script src="../shared/langnav.js"></script>
</body>
