<h1>搜索和聚焦</h1>
<p class="platforms">聚焦：Mac、iPad 和 iPhone。</p>
<h2>在 App 中</h2>
<p>在搜索栏中输入：在 Mac 上位于边栏顶部，在 iPad 或 iPhone 上位于视图顶部，在 Apple TV 上则是“搜索”标签页（输入或听写）。视图中只会显示名称匹配的节目。</p>
<h2>在聚焦中</h2>
<p>在 Mac、iPad 和 iPhone 上，你正在查看的资料库中的每个节目和每一集都会出现在聚焦中。选择其中一项会在 App 中打开其节目，并定位到该集所在的季。</p>
