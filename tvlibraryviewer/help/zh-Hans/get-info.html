<meta name="description" content="资料库中关于某个节目、某一季或某一集的全部信息。" />
<meta name="keywords" content="显示简介, 详细信息, 插图, 描述, 文件, 编解码器, 大小, 排序" />

<body>
<a name="get-info"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer 帮助</a> › 节目和剧集</nav>
<h1>显示简介</h1>
<p class="lead">从拼贴、季或剧集的菜单中选取<span class="ui">显示简介</span>。</p>
<p>其中的部分包括<span class="ui">概览</span>、<span class="ui">详细信息</span>、<span class="ui">插图</span>（所有图像，可横向滚动）、<span class="ui">描述</span>、<span class="ui">选项</span>、<span class="ui">排序</span>和<span class="ui">文件</span>（大小、编解码器、尺寸、比特率和位置）。使用 ‹ 和 › 可逐集浏览一季中的剧集（在 Mac 上按 <kbd>⌘←</kbd> <kbd>⌘→</kbd>）。</p>
<p>在 Mac 上，各部分像 TV App 中一样列在左侧。在 iPad、iPhone 和 Apple TV 上，它们显示为一个列表，iPad 和 iPhone 上还有<span class="ui">全部拷贝</span>。</p>
<div class="see"><h3>另请参阅</h3><ul><li><a href="episodes.html">标记已观看、选择和移除剧集</a></li></ul></div>
