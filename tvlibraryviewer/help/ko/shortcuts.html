<title>키보드 단축키</title>
<meta name="description" content="Mac용 TV Library Viewer의 키보드 단축키." />
<meta name="keywords" content="키보드 단축키, 키, Command" />

<body>
<a name="shortcuts"></a>
<nav class="crumbs"><a href="index.html">TV Library Viewer 도움말</a> › 참고 자료</nav>
<h1>키보드 단축키</h1>
<table>
<tr><th>키</th><th>동작</th></tr>
<tr><td><kbd>⌘K</kbd></td><td>공유 보관함에 연결</td></tr>
<tr><td><kbd>⌘O</kbd></td><td>보관함 열기</td></tr>
<tr><td><kbd>⌘R</kbd></td><td>보관함 새로 고침</td></tr>
<tr><td><kbd>⌘+</kbd> <kbd>⌘−</kbd> <kbd>⌘0</kbd></td><td>타일 크게, 작게, 실제 크기</td></tr>
<tr><td><kbd>⌘A</kbd> / <kbd>Esc</kbd></td><td>모두 선택 / 선택 해제</td></tr>
<tr><td><kbd>⌘⌫</kbd></td><td>보관함에서 제거</td></tr>
<tr><td><kbd>⌘Z</kbd></td><td>실행 취소</td></tr>
<tr><td><kbd>Space 바</kbd></td><td>프로그램 페이지에서: 재생. 플레이어에서: 재생 또는 일시 정지</td></tr>
<tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>플레이어에서: 10초 건너뛰기</td></tr>
<tr><td><kbd>⌘←</kbd> <kbd>⌘→</kbd></td><td>정보 가져오기에서: 이전 또는 다음 에피소드</td></tr>
<tr><td><kbd>⌘,</kbd></td><td>설정</td></tr>
</table>
<p>키보드를 연결한 iPad에 대해서는 <a href="ipad.html">iPad 및 iPhone</a>을 참조하십시오.</p>
